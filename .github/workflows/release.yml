name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Existing release tag (e.g. v1.1.0-beta.19)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
      channel: ${{ steps.version.outputs.channel }}
    steps:
      - name: Validate tag format
        id: tag
        env:
          TAG: ${{ inputs.tag_name || github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$ ]]; then
            echo "::error::Expected vX.Y.Z or vX.Y.Z-beta.N"
            exit 1
          fi
          echo "name=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.tag.outputs.name }}
          persist-credentials: false

      - name: Verify version and changelog
        id: version
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          sha=$(git rev-parse HEAD)
          if [[ "$GITHUB_EVENT_NAME" == push && "$sha" != "$GITHUB_SHA" ]]; then
            echo "::error::The tag no longer points at the triggering commit"
            exit 1
          fi
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path
          from noticehub.version import APP_CHANNEL, APP_VERSION

          tag = os.environ["TAG"]
          channel = "beta" if "-beta." in tag else "stable"
          if tag != f"v{APP_VERSION}" or channel != APP_CHANNEL:
              raise SystemExit("The tag must match APP_VERSION and APP_CHANNEL")
          changelog = Path("docs/wiki/changelog.md").read_text(encoding="utf-8")
          if not re.search(rf"^## {re.escape(APP_VERSION)}(?:[ \t]+·[^\n]+)?[ \t]*$", changelog, re.M):
              raise SystemExit("Add a changelog section for this version")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"tag={tag}\nchannel={channel}", file=output)
          PY
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  verify:
    needs: prepare
    uses: ./.github/workflows/tests.yml
    with:
      release_sha: ${{ needs.prepare.outputs.sha }}

  publish:
    needs: [prepare, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.prepare.outputs.tag }}
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: release-assets

      - name: Publish tested Windows ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          TESTED_SHA: ${{ needs.prepare.outputs.sha }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
        run: |
          if [[ "$(git rev-parse HEAD)" != "$TESTED_SHA" ]]; then
            echo "::error::The tag changed after testing"
            exit 1
          fi
          cd release-assets
          sha256sum --binary QQ-Notice-Hub.zip > QQ-Notice-Hub.zip.sha256
          options=()
          if [[ "$CHANNEL" == beta ]]; then
            options+=(--prerelease)
          fi
          gh release create "$TAG" QQ-Notice-Hub.zip QQ-Notice-Hub.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --generate-notes "${options[@]}"
