name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.1.0-beta.18)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Release Windows Package
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Create build venv
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt pyinstaller

      - name: Build the installer zip
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File packaging\build.ps1

      - name: Generate SHA256 checksum
        shell: powershell
        run: |
          $zipPath = Join-Path 'packaging' 'QQ-Notice-Hub.zip'
          if (-not (Test-Path -LiteralPath $zipPath)) {
              Write-Error ('Missing zip: ' + $zipPath)
              exit 1
          }
          $hash = (Get-FileHash -Path $zipPath -Algorithm SHA256).Hash.ToLower()
          "$hash *QQ-Notice-Hub.zip" | Out-File -FilePath (Join-Path 'packaging' 'QQ-Notice-Hub.zip.sha256') -Encoding ascii
          Write-Host ("QQ-Notice-Hub.zip SHA256: " + $hash)

      - name: Determine tag & pre-release status
        id: release_meta
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          if [[ "$TAG" == *"-"* ]] || [[ "$TAG" =~ (beta|alpha|rc) ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: ${{ steps.release_meta.outputs.tag }}
          prerelease: ${{ steps.release_meta.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            packaging/QQ-Notice-Hub.zip
            packaging/QQ-Notice-Hub.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
