import java.util.Properties

plugins { id 'com.android.application' }

def pairingProperties = new Properties()
def pairingFile = rootProject.file('pairing.properties')
if (pairingFile.exists()) pairingFile.withInputStream { pairingProperties.load(it) }
def defaultServer = (pairingProperties['server'] ?: '').toString().replace('\\', '\\\\').replace('"', '\\"')

 def signingProperties = new Properties()
 def signingFile = rootProject.file('keystore.properties')
 if (signingFile.exists()) signingFile.withInputStream { signingProperties.load(it) }

android { namespace 'com.agendum.app'; compileSdk 35; buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'com.agendum.app'
        minSdk 23
        targetSdk 35
        versionCode project.hasProperty('appVersionCode') ? project.property('appVersionCode').toString().toInteger() : 19
        versionName project.hasProperty('appVersionName') ? project.property('appVersionName').toString() : '1.1.0-beta.19'
        buildConfigField 'String', 'PAIR_SERVER', '"' + defaultServer + '"'
        buildConfigField 'String', 'DEFAULT_SERVER', '"' + defaultServer + '"'
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        release {
            if (signingFile.exists()) {
                storeFile file(signingProperties['storeFile'])
                storePassword signingProperties['storePassword']
                keyAlias signingProperties['keyAlias']
                keyPassword signingProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            if (signingFile.exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    defaultConfig {
        // 真机验收副本与已发布签名并存；默认构建的正式包名保持不变。
        if (project.hasProperty('agendumValidation')) { applicationIdSuffix '.validation' }
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        javaCompileOptions { annotationProcessorOptions { arguments += ['room.schemaLocation': "$projectDir/schemas".toString()] } }
    }
    testOptions { unitTests.returnDefaultValues = true }
}

dependencies {
    implementation 'androidx.room:room-runtime:2.7.2'
    annotationProcessor 'androidx.room:room-compiler:2.7.2'
    implementation 'androidx.work:work-runtime:2.10.5'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.work:work-testing:2.10.5'
    // zxing-android-embedded 4.3.0 的 POM 只声明 com.google.zxing:core，没有声明它自己
    // 在 CaptureManager 里用到的 androidx.core（ContextCompat/ActivityCompat）。
    // 缺了它，点扫码进 CaptureActivity.onResume 会 NoClassDefFoundError 直接闪退。
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'androidx.core:core:1.13.1'
}
